resume:
  controllers:
    # Main reactive-resume application
    main:
      strategy: Recreate
      pod:
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0
          fsGroup: 0
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: amruthpillai/reactive-resume
            tag: latest
            pullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: "https://resume.oluwatobia.de"
            - name: PRINTER_APP_URL
              value: "http://resume-printer.resume-apps.svc.cluster.local"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-app
                  key: uri
            - name: PRINTER_ENDPOINT
              value: "http://resume-printer.resume-apps.svc.cluster.local"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactive-resume-app
                  key: authSecret
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
    # Printer service (browserless chromium)
    printer:
      nameOverride: resume-printer
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/browserless/chromium
            tag: latest
            pullPolicy: IfNotPresent
          env:
            - name: QUEUED
              value: "10"
            - name: HEALTH
              value: "true"
            - name: CONCURRENT
              value: "5"
  service:
    main:
      controller: main
      ports:
        http:
          port: 80
          targetPort: 3000
    printer:
      controller: printer
      ports:
        http:
          port: 80
          targetPort: 3000
  ingress:
    main:
      hosts:
        - host: resume.oluwatobia.de
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: reactive-resume-pvc
      advancedMounts:
        main:
          main:
            - path: /app/data
              readOnly: false
database:
  fullnameOverride: reactive-resume-db
  cluster:
    instances: 1
    storage:
      size: 10Gi
      storageClass: longhorn-storage-class
    imageCatalogRef:
      major: 17
    initdb:
      database: reactive_resume
      owner: reactive-resume-db-admin
      secret:
        name: reactive-resume-db
