emulator:
  controllers:
    main:
      replicas: 1
      strategy: Recreate
      pod:
        terminationGracePeriodSeconds: 120
      containers:
        main:
          image:
            repository: dockurr/windows
            tag: latest
            pullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VERSION
              value: "11"
            - name: DISK_SIZE
              value: "64G"

  persistence:
    dev-kvm:
      enabled: true
      type: hostPath
      hostPath: /dev/kvm
      advancedMounts:
        main:
          main:
            - path: /dev/kvm
    dev-tun:
      enabled: true
      type: hostPath
      hostPath: /dev/net/tun
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/net/tun
    storage:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: windows-emulator-pvc
      advancedMounts:
        main:
          main:
            - path: /storage

  service:
    main:
      controller: main
      ports:
        http:
          port: 8006
          targetPort: 8006
          protocol: TCP
        rdp:
          port: 3389
          targetPort: 3389
          protocol: TCP
        rdp-udp:
          port: 3389
          targetPort: 3389
          protocol: UDP
        vnc:
          port: 5900
          targetPort: 5900
          protocol: TCP

  ingress:
    main:
      enabled: true
      hosts:
        - host: windows.oluwatobia.de
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http

