emulator:
  controllers:
    main:
      replicas: 1
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 0
          fsGroup: 0
          fsGroupChangePolicy: OnRootMismatch
      containers:
        main:
          image:
            repository: us-docker.pkg.dev/android-emulator-268719/images/30-google-x64
            tag: 30.1.2
            pullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN

  persistence:
    kvm-device:
      enabled: true
      type: hostPath
      hostPath: /dev/kvm
      advancedMounts:
        main:
          main:
            - path: /dev/kvm
  service:
    main:
      controller: main
      ports:
        http:
          port: 8554
          targetPort: 8554
        adb:
          port: 5555
          targetPort: 5555

  ingress:
    main:
      enabled: true
      hosts:
        - host: android.oluwatobia.de
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http

